for(const k in IM){const i=document.querySelector(`#${k} img`);i.src=IM[k][0];i.style.left=IM[k][1]+'px';i.style.top=IM[k][2]+'px'}
$('wl').style.transformOrigin='535px 625px';
$('wr').style.transformOrigin='895px 620px';
$('head').style.transformOrigin='700px 572px';
$('rig').style.transformOrigin='724px 1070px';

function fit(){
  const s=Math.min(innerWidth/1200,innerHeight/1120);
  $('stage').style.transform=`translate(${(innerWidth-1200*s)/2-130*s}px,${(innerHeight-1120*s)/2+30*s}px) scale(${s})`;
}
addEventListener('resize',fit);fit();

const cv=$('smoke'),cx=cv.getContext('2d');
const parts=[];
const R=(a,b)=>a+Math.random()*(b-a);
let ev={type:null,t0:0,next:2.5}, look={a:0,tgt:0,next:1}, bl={t0:-9,next:1.5}, acc=0, last=0;
const end=t=>{ev.type=null;ev.next=t+R(4,8)};
addEventListener('pointerdown',()=>{if(!ev.type){ev.type=Math.random()<.5?'flap':'smoke';ev.t0=performance.now()/1000}});

function frame(ts){
  const t=ts/1000, dt=Math.min(.05,t-last||.016); last=t;
  if(!ev.type&&t>=ev.next){ev.type=Math.random()<.5?'flap':'smoke';ev.t0=t}
  let f=0,lift=0,inh=0,emit=false;
  if(ev.type==='flap'){
    const u=(t-ev.t0)/.55;
    if(u>=3)end(t); else{f=Math.sin(u*2*Math.PI);lift=Math.max(0,f)}
  }else if(ev.type==='smoke'){
    const e=t-ev.t0;
    if(e>2.8)end(t);
    else if(e<.8)inh=e/.8;
    else if(e<2.4){inh=1-(e-.8)/1.6*.8;emit=true}
    else inh=.2*(1-(e-2.4)/.4);
  }
  // голова
  if(t>look.next){look.tgt=[-5,-3,0,3,5,0][Math.floor(Math.random()*6)];look.next=t+R(2,5.5)}
  look.a+=(look.tgt-look.a)*Math.min(1,dt*2.2);
  const ang=look.a+1.2*Math.sin(t*.9)-inh*3;
  const dx=look.a*1.6, dy=1.5*Math.sin(t*1.8+1)-lift*3+inh*2;
  $('head').style.transform=`translate(${dx}px,${dy}px) rotate(${ang}deg)`;
  // дыхание
  const b=.008*Math.sin(t*2)+.022*inh;
  $('rig').style.transform=`translateY(${-6*lift}px) scale(${1+b*.5},${1+b})`;
  // крылья
  const wa=(f>0?16*f:6*f)+1.2*Math.sin(t*1.7)+inh*4;
  $('wl').style.transform=`rotate(${wa}deg)`;
  $('wr').style.transform=`rotate(${-wa}deg)`;
  // моргание
  if(t>bl.next){bl.t0=t;bl.next=t+(Math.random()<.25?.38:R(2.5,5.5))}
  const s=(t-bl.t0)/.2, k=s<1?Math.min(1,Math.sin(s*Math.PI)*1.4):0;
  for(const id of['lidL','lidR']){const l=$(id).style;l.visibility=k>.02?'visible':'hidden';l.transform=`scaleY(${k})`}
  // дым
  if(emit){acc+=dt*16;
    const a=ang*Math.PI/180,c=Math.cos(a),sn=Math.sin(a);
    while(acc>=1){acc--;
      const n=Math.random()<.5?[646,490]:[713,496];
      const X=n[0]-700,Y=n[1]-572;
      parts.push({x:700+X*c-Y*sn+dx,y:572+X*sn+Y*c+dy,vx:R(-30,30)+(n[0]<680?-12:12),vy:R(40,70),age:0,life:R(2,2.8),r:R(8,14)});
    }}
  cx.clearRect(0,0,1448,1086);
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];p.age+=dt;
    if(p.age>=p.life){parts.splice(i,1);continue}
    p.vy-=18*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.99;
    const u=p.age/p.life, r=p.r+u*48, a=.6*Math.pow(1-u,1.3)*Math.min(1,p.age*6);
    const g=cx.createRadialGradient(p.x,p.y,0,p.x,p.y,r);
    g.addColorStop(0,`rgba(190,195,210,${a})`);g.addColorStop(1,'rgba(190,195,210,0)');
    cx.fillStyle=g;cx.beginPath();cx.arc(p.x,p.y,r,0,7);cx.fill();
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
